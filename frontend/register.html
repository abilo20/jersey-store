<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Customer Account | Mira Sport</title>
  <meta name="description" content="Register an account on Mira Sport to manage your orders and custom football jersey preferences.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-wrapper {
      max-width: 440px;
      margin: 40px auto 60px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 32px 28px;
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <header class="header"></header>
  <div id="mobile-top-bar" class="mobile-top-bar"></div>

  <main class="container">
    <div class="auth-wrapper">
      <div style="text-align:center; margin-bottom:24px;">
        <span class="brand-mark" style="margin:0 auto;">M</span>
        <h1 style="font-size:1.6rem; font-weight:900; color:var(--primary); margin-top:6px;">Create Your Account</h1>
        <p style="font-size:0.88rem; color:var(--text-muted); margin-top:4px;">Join Ethiopian football supporters. Fast checkout and order tracking.</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Alazar Kassaye" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number (Optional)</label>
          <input type="tel" id="reg-phone" class="form-input" placeholder="+251 911..." autocomplete="tel" />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-reg-btn">
          Create Account &rarr;
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; padding-top:18px; border-top:1px solid var(--border-light); font-size:0.88rem; color:var(--text-muted);">
        Already have an account? <a href="/login.html" style="font-weight:800; color:var(--accent);">Sign In here</a>
      </div>
    </div>
  </main>

  <footer class="footer"></footer>
  <nav class="mobile-nav"></nav>

  <script type="module">
    import { renderStoreNavigation, apiRequest, showToast, setAuth, isLoggedIn } from '/js/api.js';

    renderStoreNavigation('profile');

    if (isLoggedIn()) {
      window.location.href = '/profile.html';
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-reg-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await apiRequest('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            full_name: document.getElementById('reg-name').value.trim(),
            email: document.getElementById('reg-email').value.trim(),
            phone: document.getElementById('reg-phone').value.trim(),
            password: document.getElementById('reg-password').value
          })
        });

        setAuth(res.token, res.user);
        showToast('Account created successfully!', 'success');
        setTimeout(() => {
          window.location.href = '/profile.html';
        }, 600);
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account →';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Mira Sport</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .admin-login-card {
      background: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="admin-login-card">
    <div style="text-align:center; margin-bottom:24px;">
      <span class="brand-mark" style="margin:0 auto;">M</span>
      <h1 style="font-size:1.5rem; font-weight:900; color:var(--primary); margin-top:8px;">Mira Sport Administrator</h1>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">Secure management portal for store operations</p>
    </div>
    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label">Admin Username</label>
        <input type="email" id="admin-email" class="form-input" required autocomplete="username" placeholder="Abilo@admin" />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="admin-password" class="form-input" required autocomplete="current-password" />
      </div>

      <div id="login-error-msg" style="display:none; background:#FEF2F2; color:#B91C1C; border:1px solid #FECACA; padding:10px 14px; border-radius:var(--radius-sm); font-size:0.85rem; margin-bottom:14px; font-weight:600;"></div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit-btn">
        Sign In to Portal &rarr;
      </button>
    </form>

    <div style="text-align:center; margin-top:20px;">
      <a href="/index.html" style="font-size:0.85rem; color:var(--text-muted);">← Back to Storefront</a>
    </div>
  </div>

  <script type="module">
    import { setAdminAuth, isAdminLoggedIn } from '/js/admin.js';

    if (isAdminLoggedIn()) {
      window.location.href = '/admin/index.html';
    }

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-submit-btn');
      const errBox = document.getElementById('login-error-msg');
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('admin-email').value.trim(),
            password: document.getElementById('admin-password').value
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');

        setAdminAuth(data.token, data.admin);
        window.location.href = '/admin/index.html';
      } catch (err) {
        errBox.textContent = err.message || 'Admin authentication failed';
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In to Portal →';
      }
    });
  </script>
</body>
</html>
